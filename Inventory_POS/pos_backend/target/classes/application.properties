# ===================== EMAIL (SMTP) =====================
# *** THIS IS WHY ALERTS WEREN'T SENDING: the 3 values below are still placeholders. ***
# Steps to fix:
#   1. Use a real Gmail account (or your SMTP provider of choice).
#   2. Turn on 2-Step Verification: https://myaccount.google.com/security
#   3. Generate an App Password: https://myaccount.google.com/apppasswords
#      (16 characters, no spaces — NOT your normal Gmail login password)
#   4. Replace spring.mail.username, spring.mail.password, and alerts.email.to below.
#   5. Restart the app, then POST /api/alerts/test-email to confirm delivery.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=msrinivasan381@gmail.com
spring.mail.password=cmyx vhvk eiyd ebjd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Who receives the low-stock alert emails (comma-separated for multiple)
alerts.email.to=owner@example.com

# ===================== SMS (Twilio) =====================
# Sign up free at https://www.twilio.com/try-twilio — trial gives free credit,
# but on a trial account you can only SEND to phone numbers you've verified
# in the Twilio console (fine for a college demo).
twilio.account-sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
twilio.from-number=+1XXXXXXXXXX

# Who receives the low-stock SMS alerts (comma-separated for multiple, E.164 format e.g. +91XXXXXXXXXX)
alerts.sms.to=+91XXXXXXXXXX

# Turn alerting channels on/off independently without touching code
alerts.email.enabled=true
alerts.sms.enabled=false

# ===================== SCHEDULED LOW-STOCK CHECK =====================
# How often (ms) to auto-check stock and fire alerts. Default: every 6 hours.
alerts.schedule.rate-ms=21600000

# ===================== BILL EMAIL (FREE) =====================
# Emails the CUSTOMER (not the shop owner) their invoice as a PDF attachment
# right after checkout. 100% free — reuses the exact same Gmail SMTP setup
# above (spring.mail.username / password), so once EMAIL is configured there
# is nothing extra to pay for or sign up for. On by default; only fires when
# the customer actually has an email on file.
alerts.email.billing.enabled=true

# ===================== BILL WHATSAPP LINK (FREE) =====================
# Every checkout response includes a ready-to-tap "wa.me" link pre-filled
# with the bill total and invoice download link. This is a free WhatsApp
# "click to chat" link — no API key, no account, no per-message cost. The
# cashier taps "Send via WhatsApp" in the billing screen and WhatsApp opens
# (web or app) with the message ready to send to the customer's number.
# There's nothing to configure here — it's generated automatically from
# app.backend.base-url below and the customer's phone number.

# ===================== SMS / WHATSAPP BILL NOTIFICATIONS (PAID — OPTIONAL) =====================
# Fully-automated SMS/WhatsApp sending via Twilio. Left OFF by default because
# genuine automated SMS/WhatsApp delivery to arbitrary customer numbers is not
# free at any real volume: Twilio's free trial credit runs out and production
# use is billed per message. Only turn this on if you're fine paying Twilio —
# otherwise the free email + free WhatsApp link above cover the same need at
# no cost.
alerts.sms.billing.enabled=false
alerts.whatsapp.enabled=false
# A WhatsApp-enabled Twilio sender, e.g. the Twilio Sandbox number +14155238886 for testing.
twilio.whatsapp-from-number=+14155238886

# ===================== PDF INVOICE =====================
app.business.name=Inventory Management POS
# Base URL of the frontend, used to build the invoice download link sent via SMS/WhatsApp.
app.frontend.base-url=http://localhost:5500
# Base URL of THIS backend (matches server.port above) — used to build the
# direct PDF invoice link sent via email/WhatsApp/SMS, since there is no
# invoice.html page in the frontend to link to.
app.backend.base-url=http://localhost:8080

# ===================== AI SALES PREDICTION / REORDER =====================
# How many past days of sales to average over when estimating daily sales velocity.
app.prediction.lookback-days=30
# Assumed days for a new order to arrive from a supplier.
app.prediction.lead-time-days=7
# Extra safety-stock buffer (in days of average sales) on top of the lead time.
app.prediction.safety-buffer-days=3

# ===================== EXPIRY PREDICTION DASHBOARD =====================
# Products expiring within this many days show up on the dashboard's expiring-soon count.
app.expiry.warning-days=30
